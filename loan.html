
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest — выдача книги</title>
</head>
<body>
    <header>
        <p>BookNest — библиотека для читателей</p>

        <nav aria-label="Главная навигация">
            <ul>
                <li><a href="index.html">Каталог</a></li>
                <li><a href="book.html">Карточка книги</a></li>
                <li><a href="loan.html">Выдача книги</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Форма выдачи книги</h1>
        <p>Заполни данные, чтобы оформить заявку на выдачу.</p>

        <form action="loan.html" method="get">
            <fieldset>
                <legend>Данные читателя</legend>

                <p>
                    <label for="full-name">ФИО:</label>
                    <input
                        type="text"
                        id="full-name"
                        name="full-name"
                        required
                        minlength="2"
                        maxlength="100"
                    >
                </p>

                <p>
                    <label for="email">Электронная почта:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </p>

                <p>
                    <label for="phone">Телефон:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        pattern="[+]?[0-9 ()-]{7,20}"
                        title="Введи номер телефона"
                        required
                    >
                </p>
            </fieldset>

            <fieldset>
                <legend>Информация о выдаче</legend>

                <p>
                    <label for="book">Выбери книгу:</label>
                    <select id="book" name="book" required>
                        <option value="">Выбери книгу</option>
                        <option value="little-prince">Маленький принц</option>
                        <option value="1984">1984</option>
                        <option value="dune">Дюна</option>
                        <option value="harry-potter">
                            Гарри Поттер и философский камень
                        </option>
                    </select>
                </p>

                <p>
                    <label for="loan-date">Дата получения:</label>
                    <input
                        type="date"
                        id="loan-date"
                        name="loan-date"
                        required
                    >
                </p>

                <p>
                    <label for="days">Срок выдачи в днях:</label>
                    <input
                        type="number"
                        id="days"
                        name="days"
                        min="1"
                        max="30"
                        value="14"
                        required
                    >
                </p>

                <p>
                    <label for="comment">Комментарий:</label>
                    <textarea
                        id="comment"
                        name="comment"
                        rows="4"
                        maxlength="300"
                        placeholder="Дополнительная информация"
                    ></textarea>
                </p>
            </fieldset>

            <p>
                <input
                    type="checkbox"
                    id="agreement"
                    name="agreement"
                    value="yes"
                    required
                >
                <label for="agreement">
                    Подтверждаю правильность введённых данных
                </label>
            </p>

            <button type="submit">Отправить заявку</button>
        </form>
    </main>

    <footer>
        <p>BookNest — учебный проект WEB 3210.</p>
        <a href="index.html">Вернуться в каталог</a>
    </footer>
</body>
</html>
